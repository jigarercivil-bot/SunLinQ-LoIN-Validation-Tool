name: Assemble private LoIN HTML
on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'scripts/assemble.py'
      - '.github/workflows/assemble.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild application
        run: python3 scripts/assemble.py
      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build standalone LoIN tool from source parts"
            git push
          fi
