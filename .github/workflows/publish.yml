# Legacy publisher disabled. The canonical Pages release is built from
# releases/v2.35.patch.json by .github/workflows/pages.yml.
# Keeping this workflow as a harmless manual diagnostic avoids two concurrent
# deployments overwriting each other with different HTML versions.
name: Legacy Pages publisher (disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Use the Publish LoIN Tool to GitHub Pages workflow instead."
