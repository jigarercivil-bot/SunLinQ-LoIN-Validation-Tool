name: Publish LoIN Tool to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build LoIN v2.35 HTML
        run: python3 scripts/apply_release.py
      - name: Add v2.36 layout and built-in DSCRLP rules
        run: python3 scripts/build_release.py
      # Permanent download link: the "latest" release always holds the newest standalone file, at
      # https://github.com/<repo>/releases/latest/download/SunLinQ-LoIN-Validation-Tool.html
      - name: Update the latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp index.html SunLinQ-LoIN-Validation-Tool.html
          VER=$(python3 -c "import json;d=json.load(open('version.json'));print('V'+d['version']+' · build '+d['build'])")
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest LoIN tool" --notes "Newest standalone tool." --latest
          gh release upload latest SunLinQ-LoIN-Validation-Tool.html --clobber
          gh release edit latest --title "Latest LoIN tool ($VER)" --notes "Standalone, works offline. Download SunLinQ-LoIN-Validation-Tool.html below. $VER" --latest
          rm SunLinQ-LoIN-Validation-Tool.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # GitHub sometimes lists a just-uploaded Pages artifact a few seconds late, which made deploy-pages fail
      # with "No artifacts named github-pages were found". Wait briefly before deploying.
      - name: Wait for the artifact to be listed
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
